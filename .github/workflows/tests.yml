name: Automation Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: "30 3 * * *"   # every day at 09:00 IST
  workflow_dispatch:
    inputs:
      suite:
        description: "Suite to run"
        required: true
        default: "testng.xml"
        type: choice
        options:
          - testng.xml
          - smoke-suite.xml
          - api-suite.xml
          - ui-suite.xml

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Run tests
        run: |
          set -o pipefail
          # Push, PR and nightly runs use the full suite; a manual run can pick another
          mvn -B test -Dsuite=${{ github.event.inputs.suite || 'testng.xml' }} -Dheadless=true 2>&1 | tee build.log

      # Surface build errors and failed tests as annotations on the run summary
      - name: Summarise failures
        if: failure()
        run: |
          msg=$(grep -E "\[ERROR\]|Tests run:|FAILED|Exception|expected" build.log | grep -v "^\[ERROR\] *$" | head -40 | cut -c1-300 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
          echo "::error title=Build and test failures::${msg}"

      - name: Generate Allure report
        if: always()
        run: mvn -B allure:report

      - name: Upload Allure report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: target/site/allure-maven-plugin
          retention-days: 14

      # Only main-branch runs (push, nightly, manual) publish the live report; pull requests don't
      - name: Package report for GitHub Pages
        if: always() && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: target/site/allure-maven-plugin

  publish-report:
    name: Publish Allure report to GitHub Pages
    needs: test
    if: always() && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    # Publishing the report must never turn the test pipeline red
    continue-on-error: true
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      - name: Deploy report
        id: deploy
        uses: actions/deploy-pages@v4

  docker:
    name: Full suite in Docker with Selenium Grid
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Run tests against Selenium Grid
        run: |
          set -o pipefail
          docker compose up --build --exit-code-from tests 2>&1 | tee docker.log

      - name: Summarise failures
        if: failure()
        run: |
          msg=$(grep -E "\[ERROR\]|Tests run:|FAILED|Exception|expected|unhealthy|error" docker.log | head -40 | cut -c1-300 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
          echo "::error title=Docker run failures::${msg}"

      - name: Stop containers
        if: always()
        run: docker compose down

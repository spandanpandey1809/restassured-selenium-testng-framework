name: Automation Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: "30 3 * * *"   # every day at 09:00 IST
  workflow_dispatch:
    inputs:
      suite:
        description: "Suite to run"
        required: true
        default: "api-suite.xml"
        type: choice
        options:
          - api-suite.xml

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Run tests
        run: mvn -B test -Dsuite=${{ github.event.inputs.suite || 'api-suite.xml' }} -Dheadless=true

      - name: Generate Allure report
        if: always()
        run: mvn -B allure:report

      - name: Upload Allure report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: target/site/allure-maven-plugin
          retention-days: 14

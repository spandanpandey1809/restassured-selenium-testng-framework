name: Automation Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: "30 3 * * *"   # every day at 09:00 IST
  workflow_dispatch:
    inputs:
      suite:
        description: "Suite to run"
        required: true
        default: "testng.xml"
        type: choice
        options:
          - testng.xml
          - smoke-suite.xml
          - api-suite.xml
          - ui-suite.xml

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Run tests
        run: |
          set -o pipefail
          # Push, PR and nightly runs use the full suite; a manual run can pick another
          mvn -B test -Dsuite=${{ github.event.inputs.suite || 'testng.xml' }} -Dheadless=true 2>&1 | tee build.log

      # Surface build errors and failed tests as annotations on the run summary
      - name: Summarise failures
        if: failure()
        run: |
          msg=$(grep -E "\[ERROR\]|Tests run:|FAILED|Exception|expected" build.log | grep -v "^\[ERROR\] *$" | head -40 | cut -c1-300 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
          echo "::error title=Build and test failures::${msg}"

      - name: Generate Allure report
        if: always()
        run: mvn -B allure:report

      - name: Upload Allure report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: target/site/allure-maven-plugin
          retention-days: 14
